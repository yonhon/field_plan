# Supabase CLI の設定（Edge Functions の配備に使う）。プロジェクトは agri_db、inoo_farm と共用。
project_id = "field_plan"

[functions.field-mcp]
# claude.ai のコネクタは Supabase の JWT を送れないので、JWT 検証は無効にする。
# 代わりに、URL の末尾の合言葉（FIELD_MCP_TOKEN）を関数の中で確かめる。
verify_jwt = false

[functions.field-weather]
# 2 週間気温予報を画面に渡す。JWT の確かめは、プロジェクトの署名があるかを見るだけで、公開キーも通す。
# field.owners にいる利用者かどうかは、関数の中で確かめる（field-weather/index.ts の isOwner）
verify_jwt = true
