# 半年に 1 度、画面の速さの確かめの Issue を開く（docs/performance.md）。
# 1 月と 7 月の 1 日、9:00（日本時間）。手で動かすこともできる
name: Performance check reminder

on:
  schedule:
    - cron: "0 0 1 1,7 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "定期の確かめ: 速さ（$(TZ=Asia/Tokyo date +%Y-%m)）" \
            --body-file .github/perf-check.md \
            --label performance
