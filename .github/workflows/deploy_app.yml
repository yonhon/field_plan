name: Deploy App (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/deploy_app.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # 上げたファイル（artifact）が見えるようになったかを、API で確かめる

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 計算のテストが通らなければ、公開しない。node --test の "*" は Node 21 からなので、版を決めて入れる
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test
        run: node --test "tests/*.test.mjs"

      # 版の印（app/version.json）を、これから公開するファイルそのものから作る。Service Worker は、
      # これで版が変わったかを確かめ、取ったファイルを照らし合わせる（scripts/build-version.mjs）。
      # 一式の一覧（app/sw.js の FILES）にあるファイルがなければ、ここで止まる
      - name: Build version
        run: node scripts/build-version.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

      # 上げたファイルが API で見えるようになるまで待つ。2026-11-24 に、上げた 1 秒後の公開の段が「github-pages が見つからない」で
      # 何回も続けて落ちた（GitHub の稼働状況には障害が出ていなかった）。5 秒おきに、2.5 分まで確かめる
      - name: Wait for the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -ge 1 ]; then
              echo "見えるようになった（${i} 回目）"
              exit 0
            fi
            sleep 5
          done
          echo "上げたファイルが 2.5 分たっても見えません"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 公開中のサイトが、作った版の印と同じ中身を配っているかを確かめる。配信が切り替わるまで、5 分まで確かめ直す。
      # 違えば失敗にする（公開は取り消されないが、失敗の知らせが届く）
      - name: Verify deployed files
        run: node scripts/build-version.mjs --verify "${{ steps.deployment.outputs.page_url }}"
