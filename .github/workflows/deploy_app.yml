name: Deploy App (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/deploy_app.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# GitHub の雛形と同じく、ファイルを用意して上げるジョブ（build）と、公開するジョブ（deploy）に分ける。
# 同じジョブで上げた直後に公開すると、上げたファイルがまだ見えず「No artifacts named "github-pages"」で落ちることが続いた（2026-11-24）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 計算のテストが通らなければ、公開しない。node --test の "*" は Node 21 からなので、版を決めて入れる
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test
        run: node --test "tests/*.test.mjs"

      # 版の印（app/version.json）を、これから公開するファイルそのものから作る。Service Worker は、
      # これで版が変わったかを確かめ、取ったファイルを照らし合わせる（scripts/build-version.mjs）。
      # 一式の一覧（app/sw.js の FILES）にあるファイルがなければ、ここで止まる
      - name: Build version
        run: node scripts/build-version.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 公開の確かめに使う版の印を、同じ中身から作り直す（版の印は、一式の中身だけから決まるので、build のジョブと同じになる）
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build version
        run: node scripts/build-version.mjs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 公開中のサイトが、作った版の印と同じ中身を配っているかを確かめる。配信が切り替わるまで、5 分まで確かめ直す。
      # 違えば失敗にする（公開は取り消されないが、失敗の知らせが届く）
      - name: Verify deployed files
        run: node scripts/build-version.mjs --verify "${{ steps.deployment.outputs.page_url }}"
