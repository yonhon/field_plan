name: Deploy App (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/deploy_app.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 計算のテストが通らなければ、公開しない。node --test の "*" は Node 21 からなので、版を決めて入れる
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test
        run: node --test "tests/*.test.mjs"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
